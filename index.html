<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const theme = localStorage.getItem("react_p2p_theme");
        if (theme === "dark" || theme === "light")
          document.documentElement.dataset.theme = theme;
      } catch (_) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#61275b" />
    <meta
      name="description"
      content="Send files, folders and notes between your devices. Browser-to-browser, encrypted, with recipient approval and file verification."
    />
    <meta name="referrer" content="no-referrer" />
    <title>PIMXNODE — Secure file sharing between devices</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/manrope-latin.woff2"
      crossorigin
    />
    <meta property="og:title" content="PIMXNODE — Files in motion" />
    <meta
      property="og:description"
      content="A private exchange between your devices. Files, folders and the occasional note."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PIMXNODE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PIMXNODE — Secure file sharing between devices"
    />
    <meta
      name="twitter:description"
      content="Send original files, folders and notes between devices. Encrypted in your browser, with no account required."
    />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PIMXNODE — Files in motion. Devices in sync."
    />
    <meta name="twitter:image" content="/social-card.png" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <script>
      if (
        new URLSearchParams(location.search).has("room") ||
        location.pathname === "/pimxnodeadmin"
      ) {
        document.querySelector('meta[name="robots"]').content =
          "noindex,follow";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >PIMXNODE needs JavaScript to connect devices and encrypt transfers.
      Enable it and reload to continue.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
